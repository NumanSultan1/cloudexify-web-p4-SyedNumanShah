<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Customer registration page for Brew & Bite cafe and bakery in Deolai, Swat." />
    <title>Register | Brew & Bite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-page">
      <div class="container">
        <div class="auth-shell">
          <section class="auth-visual" aria-label="Brew and Bite bakery counter">
            <div class="auth-visual-copy">
              <p class="eyebrow">CAFE &amp; BAKERY</p>
              <h1>Start a slower ritual.</h1>
            </div>
          </section>

          <section class="auth-card">
            <div class="auth-brand mb-4">
              <a href="index.html" class="navbar-brand d-flex align-items-center" aria-label="Brew and Bite home page">
                <span class="brand-mark">B</span>
                <span class="brand-stack">
                  <span class="brand-name">Brew &amp; Bite</span>
                  <small class="brand-tag">CAFE &amp; BAKERY</small>
                </span>
              </a>
            </div>

            <div class="mb-4">
              <p class="eyebrow">Join us</p>
              <h1>Create an account</h1>
            </div>

            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="registerName" class="form-label">Full name</label>
                <input type="text" class="form-control" id="registerName" placeholder="Your full name" required />
              </div>

              <div class="mb-3">
                <label for="registerEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="registerEmail" placeholder="you@example.com" required />
              </div>

              <div class="mb-3">
                <label for="registerPhone" class="form-label">Phone (optional)</label>
                <input type="tel" class="form-control" id="registerPhone" placeholder="03xx xxxxxxx" />
              </div>

              <div class="mb-3">
                <label for="registerPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="registerPassword" placeholder="Create a password" required />
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required />
              </div>

              <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary btn-lg">Register</button>
              </div>

              <div id="registerFeedback" class="form-feedback" aria-live="polite"></div>

              <p class="mb-0 auth-link-text">
                Already have an account?
                <a href="login.html">Login</a>
              </p>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
